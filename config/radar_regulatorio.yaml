# Radar regulatório (Fase 15) — só fontes oficiais com feed ou API pública (conferidas em 05/10/2026).
# Sem feed/API: ANBIMA, B3, Diário Oficial (INLABS exige login) — não raspamos páginas.
verificado_em: 2026-10-05

fontes:
  - {id: cvm, nome: "CVM — notícias", tipo: rss, url: "https://www.gov.br/cvm/pt-br/assuntos/noticias/RSS",
     filtro: ["resolução", "resolucao", "norma", "audiência pública", "audiencia publica", "ofício circular", "oficio circular",
              "parecer de orientação", "deliberação", "regulament", "regra", "consulta pública", "sandbox", "edita", "altera"]}
  - {id: receita, nome: "Receita Federal — notícias", tipo: rss, url: "https://www.gov.br/receitafederal/pt-br/assuntos/noticias/RSS",
     filtro: ["instrução normativa", "instrucao normativa", "imposto de renda", "irpf", "irpj", "tributa", "aplicaç", "investiment",
              "declaração", "isenç", "alíquota", "aliquota", "come-cotas", "jcp", "dividendo", "cripto", "offshore"]}
  - {id: bcb, nome: "Banco Central — normativos", tipo: bcb_normativos,
     url: "https://www.bcb.gov.br/api/search/app/normativos/buscanormativos",
     tipos: ["Resolução CMN", "Resolução BCB", "Circular", "Instrução Normativa BCB", "Carta Circular", "Resolução Conjunta"]}
  - {id: camara, nome: "Câmara dos Deputados — projetos de lei", tipo: camara,
     url: "https://dadosabertos.camara.leg.br/api/v2/proposicoes",
     palavras: ["imposto de renda", "fundos de investimento", "mercado de capitais", "previdência complementar",
                "letra de crédito", "criptoativos", "tributação de aplicações", "juros sobre capital próprio", "dividendos"]}

