# Fontes de notícias por RSS/feeds oficiais — conferidas em 03/10/2026 (item 3.1 do roteiro).
# Regra: só feeds públicos; nada de contornar paywall (de jornais com paywall vêm só manchete e resumo do próprio feed).
# Para desligar uma fonte: ativo: false. Para acrescentar: copie um bloco e teste com `uv run quiron-noticias --fontes`.
fontes:
  # peso = credibilidade/prioridade na nota de relevância (oficial 1,0 · imprensa de referência 0,9 · portal 0,75).
  # --- Brasil: imprensa de referência
  - {nome: Valor Econômico, grupo: brasil, peso: 0.9, url: "https://valor.globo.com/rss/valor"}
  - {nome: Brazil Journal, grupo: brasil, peso: 0.9, url: "https://braziljournal.com/feed/"}
  - {nome: Bloomberg Línea, grupo: brasil, peso: 0.9, url: "https://www.bloomberglinea.com.br/arc/outboundfeeds/rss/?outputType=xml"}
  - {nome: NeoFeed, grupo: brasil, peso: 0.85, url: "https://neofeed.com.br/feed/"}
  # --- Brasil: portais de finanças e economia
  - {nome: InfoMoney, grupo: brasil, peso: 0.8, url: "https://www.infomoney.com.br/feed/"}
  - {nome: Estadão E-Investidor, grupo: brasil, peso: 0.75, url: "https://einvestidor.estadao.com.br/feed/"}
  - {nome: Folha Mercado, grupo: brasil, peso: 0.8, url: "https://feeds.folha.uol.com.br/mercado/rss091.xml"}
  - {nome: Exame Invest, grupo: brasil, peso: 0.75, url: "https://exame.com/invest/feed/"}
  - {nome: Money Times, grupo: brasil, peso: 0.7, url: "https://www.moneytimes.com.br/feed/"}
  - {nome: Seu Dinheiro, grupo: brasil, peso: 0.7, url: "https://www.seudinheiro.com/feed/"}
  - {nome: g1 Economia, grupo: brasil, peso: 0.75, url: "https://g1.globo.com/rss/g1/economia/"}
  - {nome: Agência Brasil — Economia, grupo: brasil, peso: 0.8, url: "https://agenciabrasil.ebc.com.br/rss/economia/feed.xml"}
  # --- Global
  - {nome: Financial Times, grupo: global, peso: 0.9, url: "https://www.ft.com/markets?format=rss"}
  - {nome: The Economist, grupo: global, peso: 0.9, url: "https://www.economist.com/finance-and-economics/rss.xml"}
  - {nome: CNBC, grupo: global, peso: 0.75, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664"}
  - {nome: MarketWatch, grupo: global, peso: 0.75, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
  - {nome: BBC Business, grupo: global, peso: 0.75, url: "https://feeds.bbci.co.uk/news/business/rss.xml"}
  # --- Oficiais (informação primária)
  - {nome: Banco Central — Copom, grupo: oficiais, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/comunicadoscopom"}
  - {nome: Banco Central — notas, grupo: oficiais, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notasImprensa"}
  - {nome: Banco Central — notícias, grupo: oficiais, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/noticias"}
  - {nome: CVM, grupo: oficiais, url: "https://www.gov.br/cvm/pt-br/assuntos/noticias/RSS"}
  - {nome: IBGE, grupo: oficiais, tipo: ibge_api, url: "https://servicodados.ibge.gov.br/api/v3/noticias/?qtd=30"}
  - {nome: Federal Reserve, grupo: oficiais, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
  - {nome: BCE (Banco Central Europeu), grupo: oficiais, url: "https://www.ecb.europa.eu/rss/press.html"}

# Sem feed público oficial (conferido em 05/10/2026; não raspamos páginas):
