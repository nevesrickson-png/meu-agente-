# Comportamento do agente do Quíron (runtime próprio). Edite com cuidado.

# Permissões por ferramenta: livre (usa sozinho) · confirmar (pede ✅ no Telegram) · bloqueado (nunca usa).
# Nomes: <servidor>__<ferramenta> (com _ no lugar de -) ou ferramentas internas. "*" vale para o servidor inteiro.
permissoes:
  padrao: livre
  regras:
    quiron_biblioteca__ingerir: confirmar       # processa livros (pesado)
    quiron_biblioteca__reclassificar: confirmar
    esquecer: confirmar                         # apagar memória
    quiron_assessoria__esquecer_cliente: confirmar   # LGPD: apaga tudo de um cliente
    quiron_assessoria__aplicar_reuniao_na_ficha: confirmar   # muda a ficha com o que saiu da reunião
    propor_skill: confirmar                     # o agente criar uma skill nova
    # Ações que apagam algo ou mexem fora do Quíron: pela IA pedem ✅ (os comandos diretos, como /feito, continuam na hora).
    # Protege também contra texto malicioso vindo de notícias/páginas tentando "mandar" o agente fazer algo.
    quiron_organizacao__remover_tarefa: confirmar
    quiron_organizacao__criar_evento: confirmar     # escreve na sua Google Agenda
    quiron_mercado__remover_alerta: confirmar
    quiron_carreira__fechar_tese: confirmar         # fecha a tese e conta no track record
    cancelar_agendamento: confirmar                 # cancela lembrete/rotina

# Regras de compliance aplicadas na resposta (hooks).
compliance:
  rascunho_para_cliente: true      # mensagem para cliente sai marcada como RASCUNHO
  rodape_uso_interno: true         # análise/recomendação de ação ganha o rodapé de uso interno

memoria:
  turnos_recentes: 8               # trocas lembradas na íntegra; as mais antigas viram resumo
  resumir_acima_de: 16             # quando passar disso, compacta

batimento:                          # "heartbeat": o Quíron confere ROTINAS.md sozinho
  ativo: true
  intervalo_min: 120
  horario: ["07:00", "22:00"]

# Rotinas criadas automaticamente na primeira vez que o bot liga (você pode cancelar no Telegram com /agenda).
rotinas_padrao:
  - {texto: "Faça meu briefing.", tipo: tarefa, recorrencia: "diario 07:30"}   # persona: fins de semana normais
  - {texto: "/revisao", tipo: tarefa, recorrencia: "semanal domingo 18:00"}   # revisão semanal (Fase 14), direto, sem IA
  - {texto: "/radar novidades", tipo: tarefa, recorrencia: "semanal segunda 08:20"}   # radar regulatório (Fase 15)
