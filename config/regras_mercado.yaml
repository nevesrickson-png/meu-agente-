# Regras de mercado usadas nos cálculos do Quíron.
#
# ⚠️  RASCUNHO MONTADO PELO CLAUDE CODE EM 03/10/2026 — NADA AQUI FOI CONFERIDO AINDA.
#     Regras tributárias mudam. A MP 1.303/2025 (IR único de 17,5% e 5% em LCI/LCA) CADUCOU em 08/10/2025 sem efeito
#     (Ato Declaratório CN 67/2025). Valores conferidos pelo Quíron em 10/10/2026 nas fontes primárias citadas em cada bloco.
#     Confira cada bloco na fonte oficial indicada e preencha `verificado_em` (AAAA-MM-DD).
#     Enquanto `verificado_em` estiver vazio, o Quíron avisa que o bloco NÃO foi verificado.
#     Depois de 90 dias da verificação, ele avisa que é hora de conferir de novo.

renda_fixa:
  verificado_em:        # ← preencha após conferir
  fonte: "Receita Federal — Perguntas e Respostas IRPF; Lei 11.033/2004"
  ir_tabela_regressiva:   # prazo da aplicação (dias corridos) → alíquota
    - {ate_dias: 180, aliquota: 0.225}
    - {ate_dias: 360, aliquota: 0.20}
    - {ate_dias: 720, aliquota: 0.175}
    - {acima_de_dias: 720, aliquota: 0.15}
  isentos_pf: [LCI, LCA, CRI, CRA, CDCA, LCD, LIG, "Letra Hipotecária", "CPR (mercado financeiro)", "Debêntures incentivadas (Lei 12.431)", "Poupança"]
  nao_isentos_pf: ["Debêntures de infraestrutura da Lei 14.801/2024 (seguem a tabela regressiva)"]
  iof:
    aplica_resgate_antes_de_dias: 30
    observacao: "Tabela regressiva diária do IOF sobre o rendimento (Decreto 6.306/2007, art. 32 e anexo) — passos desiguais"
    tabela_dia_1_a_30: [96, 93, 90, 86, 83, 80, 76, 73, 70, 66, 63, 60, 56, 53, 50, 46, 43, 40, 36, 33, 30, 26, 23, 20, 16, 13, 10, 6, 3, 0]

poupanca:
  verificado_em:        # ← preencha após conferir
  fonte: "Lei 8.177/1991 com redação da Lei 12.703/2012"
  selic_gatilho: 8.5            # % a.a.: acima disso a poupança rende 0,5% a.m. + TR
  rendimento_mensal_acima: 0.005
  percentual_selic_abaixo: 0.70 # Selic até o gatilho: 70% da Selic + TR
  isenta_ir_pf: true

fundos:
  verificado_em:
  fonte: "Lei 14.754/2023; Receita Federal"
  come_cotas:
    meses: [maio, novembro]
    longo_prazo: 0.15
    curto_prazo: 0.20
  curto_prazo_tabela: [{ate_dias: 180, aliquota: 0.225}, {acima_de_dias: 180, aliquota: 0.20}]
  acoes: {aliquota_resgate: 0.15, come_cotas: false}
  fii_rendimentos_pf:
    isento: true
    condicoes: "Cotas negociadas exclusivamente em bolsa/balcão; fundo com ≥ 100 cotistas; PF com < 10% das cotas E < 10% dos rendimentos; PFs ligadas com < 30% (Lei 11.033, art. 3º, III e §1º, red. Lei 14.754/2023). Vale também para Fiagro."
  fii_ganho_capital: 0.20

renda_variavel:
  verificado_em:
  fonte: "Lei 11.033/2004 arts. 2º e 3º; Lei 9.959/2000 art. 8º; Lei 9.249/1995 arts. 9º e 10; Lei 15.270/2025; LC 224/2025"
  acoes_swing_trade: 0.15
  acoes_day_trade: 0.20
  isencao_vendas_mensais_acoes_ate: 20000.00   # só ações à vista, swing trade
  etf_renda_variavel: 0.15                      # sem isenção dos R$ 20 mil
  irrf_dedo_duro: {swing_trade: 0.00005, day_trade: 0.01, base: {swing_trade: "valor de venda", day_trade: "resultado positivo do dia"}}
  dividendos:
    isentos: true                       # Lei 9.249, art. 10
    retencao_mensal: {acima_de_por_empresa: 50000.00, aliquota: 0.10, base: "valor TOTAL do mês, sem deduções"}  # Lei 15.270/2025 (art. 6º-A da Lei 9.250), desde 01/2026
    exterior_irrf: 0.10
    transicao: "lucros apurados até 2025 com distribuição aprovada até 31/12/2025 não sofrem retenção"
    observacao: "Dividendos entram na base do imposto mínimo da alta renda (irpf_alta_renda); os 10% retidos são compensados lá."
  jcp_irrf: 0.175       # LC 224/2025, art. 8º (Lei 9.249, art. 9º, §2º), desde 01/01/2026

previdencia:
  verificado_em:
  fonte: "Lei 11.053/2004; Lei 14.803/2024; Receita Federal"
  pgbl_deducao_maxima_renda_bruta: 0.12
  tabela_regressiva:
    - {ate_anos: 2, aliquota: 0.35}
    - {ate_anos: 4, aliquota: 0.30}
    - {ate_anos: 6, aliquota: 0.25}
    - {ate_anos: 8, aliquota: 0.20}
    - {ate_anos: 10, aliquota: 0.15}
    - {acima_de_anos: 10, aliquota: 0.10}
  escolha_regime: "Pela Lei 14.803/2024, o regime (progressivo/regressivo) pode ser escolhido até o 1º resgate ou benefício — confira"

irpf_tabela_mensal:
  verificado_em:
  fonte: "Receita Federal — Tributação de 2026 (tabela mensal de mai/2025 mantida em 2026, Lei 15.191/2025); Lei 15.270/2025 (redução e desconto simplificado) — conferido pelo Quíron em 10/10/2026"
  observacao: >
    Valores-base da tabela de mai/2025. A partir de 2026, a Lei 15.270/2025 criou uma REDUÇÃO do imposto: zera para
    rendimentos tributáveis até R$ 5.000/mês e diminui gradualmente até R$ 7.350/mês. CONFIRA na Receita.
  faixas:              # base mensal até (R$) → alíquota e parcela a deduzir; a última faixa sem teto
    - {ate: 2428.80, aliquota: 0.0, deduzir: 0.0}
    - {ate: 2826.65, aliquota: 0.075, deduzir: 182.16}
    - {ate: 3751.05, aliquota: 0.15, deduzir: 394.16}
    - {ate: 4664.68, aliquota: 0.225, deduzir: 675.49}
    - {aliquota: 0.275, deduzir: 908.73}
  reducao_2026:        # redução do imposto (Lei 15.270/2025), por mês e por ano
    mensal: {zera_ate: 5000.00, reducao_maxima: 312.89, faixa_ate: 7350.00, constante: 978.62, fator: 0.133145}
    anual: {zera_ate: 60000.00, reducao_maxima: 2694.15, faixa_ate: 88200.00, constante: 8429.73, fator: 0.095575}
  deducoes_anuais:
    dependente: 2275.08
    educacao_por_pessoa: 3561.50
    desconto_simplificado: 0.20
    desconto_simplificado_teto: 17640.00   # a partir do ano-calendário 2026 (16.754,34 até o ano-calendário 2025) — art. 10, X, Lei 9.250
    desconto_simplificado_mensal: 607.20   # na fonte: 25% da faixa isenta, no lugar das deduções legais se for maior
    pgbl_maximo_renda_tributavel: 0.12   # só na declaração completa e para quem contribui ao INSS/regime próprio

irpf_alta_renda:
  verificado_em:
  fonte: "Lei 15.270/2025 — imposto mínimo (IRPFM) a partir de 2026"
  observacao: >
    Quem tem renda anual total acima de R$ 600 mil paga uma alíquota mínima efetiva que sobe linearmente até 10% em
    R$ 1,2 milhão (descontado o IR já pago). A base inclui dividendos; alguns rendimentos isentos ficam fora. CONFIRA.
  renda_minima_anual: 600000.00
  renda_aliquota_cheia: 1200000.00
  aliquota_maxima: 0.10
  dividendos_retencao: {acima_por_mes_por_empresa: 50000.00, aliquota: 0.10, base: total_do_mes}   # 10% sobre o TOTAL pago no mês, sem deduções (art. 6º-A da Lei 9.250); lucros até 2025 com distribuição aprovada até 31/12/2025 ficam fora

inss:
  verificado_em:
  fonte: "Portaria Interministerial MPS/MF nº 13, de 09/01/2026; Decreto 12.797/2025 (salário mínimo R$ 1.621,00) — conferido pelo Quíron em 10/10/2026"
  salario_minimo: 1621.00
  teto_mensal: 8475.55
  empregado_faixas:    # contribuição progressiva do empregado (CLT)
    - {ate: 1621.00, aliquota: 0.075}
    - {ate: 2902.84, aliquota: 0.09}
    - {ate: 4354.27, aliquota: 0.12}
    - {ate: 8475.55, aliquota: 0.14}
  contribuinte_individual: 0.20        # autônomo pessoa física (carnê), até o teto
  pro_labore_retido: 0.11              # sócio, até o teto
  patronal_lucro_presumido: 0.20       # empresa sobre o pró-labore (sem teto); no Simples III/V já está no DAS

simples_nacional:
  verificado_em:
  fonte: "LC 123/2006 (anexos com redação da LC 155/2016)"
  observacao: "Alíquota efetiva = (RBT12 × alíquota − parcela a deduzir) ÷ RBT12. Fator R ≥ 28% leva serviços do Anexo V ao III."
  limite_anual: 4800000.00
  fator_r_minimo: 0.28
  sublimite_icms_iss: 3600000.00   # art. 13-A: acima disso ISS/ICMS são pagos fora do DAS
  anexo_iii:           # serviços (com fator R ≥ 28%) — inclui CPP e ISS
    - {ate: 180000.00, aliquota: 0.06, deduzir: 0.0}
    - {ate: 360000.00, aliquota: 0.112, deduzir: 9360.00}
    - {ate: 720000.00, aliquota: 0.135, deduzir: 17640.00}
    - {ate: 1800000.00, aliquota: 0.16, deduzir: 35640.00}
    - {ate: 3600000.00, aliquota: 0.21, deduzir: 125640.00}
    - {ate: 4800000.00, aliquota: 0.33, deduzir: 648000.00}
  anexo_v:             # serviços intelectuais com fator R < 28%
    - {ate: 180000.00, aliquota: 0.155, deduzir: 0.0}
    - {ate: 360000.00, aliquota: 0.18, deduzir: 4500.00}
    - {ate: 720000.00, aliquota: 0.195, deduzir: 9900.00}
    - {ate: 1800000.00, aliquota: 0.205, deduzir: 17100.00}
    - {ate: 3600000.00, aliquota: 0.23, deduzir: 62100.00}
    - {ate: 4800000.00, aliquota: 0.305, deduzir: 540000.00}

lucro_presumido:
  verificado_em:
  fonte: "Lei 9.249/1995; Lei 9.430/1996; Lei 7.689/1988; LC 224/2025 art. 4º §§ 4º-VII e 5º; Decreto 12.808/2025 art. 12"
  presuncao_servicos: 0.32
  irpj: 0.15
  irpj_adicional: 0.10
  irpj_adicional_acima_anual: 240000.00   # base presumida acima de R$ 20 mil/mês
  csll: 0.09
  pis: 0.0065
  cofins: 0.03
  iss_padrao: 0.05                        # varia por município (2% a 5%): informe o do cliente
  acrescimo_presuncao_lc224: 0.10         # +10% na presunção de IRPJ/CSLL (32% → 35,2%) só na parcela da receita acima do limite
  acrescimo_limite_receita_anual: 5000000.00   # proporcional por período (R$ 1,25 mi/trimestre)
  acrescimo_vigencia: {irpj: "2026-01-01", csll: "2026-04-01"}   # contestado no STF (ADIs 7920 e 7936)
  observacao: "PIS/Cofins cumulativos até 31/12/2026; a CBS os substitui a partir de 2027 (LC 214/2025)"

fgc:
  verificado_em:
  fonte: "Res. CMN 4.222/2013, Anexo II (red. Res. 4.620/2017, 5.184/2024 e 5.279/2026); fgc.org.br"
  limite_por_cpf_por_instituicao: 250000.00
  teto_global: 1000000.00
  teto_global_renovacao_anos: 4
  cobre: [CDB, RDB, LCI, LCA, LCD, LC, "Letra Hipotecária", "Poupança", "Conta corrente", "Conta-salário", "Compromissada com título de empresa ligada"]
  nao_cobre: [CRI, CRA, "Debêntures", "Fundos", LF, LIG, COE, "Instrumentos subordinados", "Previdência", "Ações", "Tesouro Direto (risco soberano, não FGC)"]

itcmd:
  verificado_em:
  fonte: "LC 227/2026 (arts. 150, 155 e 156); EC 132/2023; Resolução do Senado 9/1992 (teto de 8%); leis estaduais citadas por UF"
  aliquota_maxima_nacional: 0.08
  observacao: >
    LC 227/2026 art. 156 § 2º: progressividade por faixa (como no IR). A faixa [mín, máx] abaixo é só o intervalo e o
    cálculo usa a MÁXIMA (conservador: superestima em estados com faixas). SP, MG, PR e ES ainda têm alíquota fixa
    (lei estadual nova pendente). PE: isento até R$ 80 mil desde 01/01/2026 (LC 563/2025). Conferido em 10/10/2026.
  previdencia: "Não incide ITCMD sobre previdência complementar (PGBL/VGBL), seguro e pecúlio — LC 227/2026 art. 150, III e STF Tema 1214 (RE 1.363.013)"
  estados:               # UF → alíquota (fixa) ou faixa [mínima, máxima]; faixa → o cálculo usa a MÁXIMA (conservador)
    SP: 0.04
    RJ: [0.04, 0.08]
    MG: 0.05
    PR: 0.04
    SC: [0.01, 0.07]     # Lei 13.136/2004 art. 9º (a faixa de 8% foi revogada)
    RS: [0.0, 0.06]      # causa mortis (Lei 8.821/1989); doação 3%–4%
    DF: [0.04, 0.06]
    BA: [0.04, 0.08]
    GO: [0.02, 0.08]     # CTE (Lei 11.651/1991) art. 78
    PE: [0.02, 0.08]
    CE: [0.02, 0.08]
    ES: 0.04

tesouro_direto:
  verificado_em:        # ← preencha após conferir
  fonte: "B3 — tarifas do Tesouro Direto (b3.com.br); tesourodireto.com.br"
  taxa_custodia_b3: 0.002          # 0,20% a.a., provisionada diariamente; cobrada na venda, no vencimento ou no pagamento de juros
  isencao_custodia: "Tesouro Selic: sem taxa até R$ 10.000 por CPF; acima, só sobre o excedente. Educa+/Renda+: 0% no vencimento e em recebimentos até 4/6 salários mínimos; 0,10% acima"
