<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quíron — entrar</title>
<script src="/tema.js"></script>
<script src="/icones.js"></script>
<link rel="stylesheet" href="/tema.css">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
</head>
<body class="tela-login">
<form method="post" action="/login" class="caixa-login">
  <div class="marca">Quíron</div>
  <label for="senha" class="dica">Senha do Terminal</label>
  <input id="senha" name="senha" type="password" autofocus required>
  <button type="submit">Entrar</button>
  <p class="erro-login" id="erro" hidden>Senha incorreta.</p>
</form>
<script>if (location.search.includes("erro")) document.getElementById("erro").hidden = false;</script>
</body>
</html>
