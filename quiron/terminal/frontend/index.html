<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quíron</title>
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<script src="/tema.js"></script>
<script src="/icones.js"></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="stylesheet" href="/tema.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/nav.css">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
</head>
<body>
<header class="topo">
  <a class="marca" href="/">Quíron</a>
  <nav id="abas"></nav>
  <form id="barra" class="barra" autocomplete="off">
    <span class="prompt" data-ico="buscar" aria-hidden="true"></span>
    <input id="comando" placeholder="Buscar ativo ou comando — PETR4, WEGE3 DCF, FUND, CHAT, HELP" spellcheck="false" aria-label="Barra de comando">
    <kbd class="atalho" aria-hidden="true">Ctrl K</kbd>
  </form>
  <div class="controles">
    <select id="layout" aria-label="Layout"></select>
    <button id="salvar" type="button" title="Salvar o layout atual com um nome" aria-label="Salvar layout"><span data-ico="salvar"></span><span class="rotulo">Salvar</span></button>
    <span id="conexao" class="conexao" title="Conexão com o servidor">●</span>
    <span id="relogio" class="relogio"></span>
    <span id="nav-extra"></span>
  </div>
</header>
<main id="grade" class="grade" aria-live="polite"></main>
<footer class="fita"><div id="fita" class="fita-trilho"></div></footer>
<div id="aviso" class="aviso" role="status"></div>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/nav.js"></script>
<script src="/app.js"></script>
</body>
</html>
