[project]
name = "quiron"
version = "0.1.0"
description = "Quíron — parceiro de análise pessoal do assessor (sistema de propriedade de Rickson Messias)"
readme = "LEIA-ME.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ebooklib>=0.20",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "litellm>=1.50",
    "markdown>=3.11",
    "matplotlib>=3.11.2",
    "mcp>=2.3,<3",
    "ocrmypdf>=17.13.0",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[project.scripts]
quiron-mcp-sistema = "quiron.mcp.sistema.servidor:main"
quiron-mcp-biblioteca = "quiron.mcp.biblioteca.servidor:main"
quiron-mcp-mercado = "quiron.mcp.mercado.servidor:main"
quiron-briefing = "quiron.servicos.mercado.cli:main"
quiron-mcp-noticias = "quiron.mcp.noticias.servidor:main"
quiron-mcp-academia = "quiron.mcp.academia.servidor:main"
quiron-mcp-analise = "quiron.mcp.analise.servidor:main"
quiron-mcp-assessoria = "quiron.mcp.assessoria.servidor:main"
quiron-academia = "quiron.servicos.academia.cli:main"
quiron-noticias = "quiron.servicos.noticias.cli:main"
quiron-terminal = "quiron.terminal.backend.app:main"
quiron = "quiron.iniciar:main"
quiron-agente = "quiron.runtime.agente:main"
quiron-telegram = "quiron.runtime.telegram_bot:main"
quiron-hermes-preparar = "quiron.runtime.hermes:main"
quiron-comparativo = "quiron.runtime.comparativo:main"
quiron-ingerir = "quiron.servicos.biblioteca.cli:main"
quiron-testar-cerebro = "quiron.nucleo.cerebro:testar_conexao_cli"
quiron-gerar-persona = "quiron.nucleo.persona:main"
quiron-configurar = "quiron.configurador.app:main"
quiron-google = "quiron.servicos.organizacao.google_agenda:main"
quiron-mcp-organizacao = "quiron.mcp.organizacao.servidor:main"
quiron-mcp-carreira = "quiron.mcp.carreira.servidor:main"
quiron-offline = "quiron.servicos.offline.cli:main"
quiron-mcp-conteudo = "quiron.mcp.conteudo.servidor:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiron"]

[tool.pytest.ini_options]
testpaths = ["testes"]
markers = ["online: precisa de chave de API e internet (rode com -m online)"]
addopts = "-m 'not online'"
